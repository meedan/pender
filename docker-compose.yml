volumes:
  redis:
  minio:
  postgres17:
services:
  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    volumes:
      - "redis:/data"
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio:/data"
    environment:
      MINIO_ROOT_USER: AKIAIOSFODNN7EXAMPLE
      MINIO_ROOT_PASSWORD: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  postgres:
    image: postgres:17-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      # POSTGRES_DB: pender-tests
      POSTGRES_DB: pender_test__db
  pender:
    env_file:
      - .env
    build: .
    shm_size: 1G
    ports:
      - "3200:3200"
      - "9555:9555"
    volumes:
      - ".:/app/pender"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      APP: pender
      DEPLOY_ENV: local
      RAILS_ENV: development
      SERVER_PORT: 3200
  pender-background:
    build: .
    shm_size: 1G
    volumes:
      - ".:/app/pender"
    depends_on:
      - pender
    environment:
      APP: pender-background
      DEPLOY_ENV: local
      RAILS_ENV: development
      SERVER_PORT: 3200
